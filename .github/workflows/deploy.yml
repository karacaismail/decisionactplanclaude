name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Kalite kapıları. Biri kırmızıysa yayın durur.
      - name: Tip denetimi ve arayüz kapısı
        run: npm run lint
      - name: Birim testleri
        run: npm run test:unit
      - name: Playwright Chromium kurulumu
        run: npx playwright install --with-deps chromium
      - name: Duman testi (Chromium 320 ve 1280)
        run: npm run test:e2e:ci
        env:
          CI: true
      - name: Playwright izleri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
